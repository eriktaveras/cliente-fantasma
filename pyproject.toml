[project]
name = "cliente-fantasma"
version = "0.1.0"
description = "Stress-test WhatsApp sales bots with synthetic Latin American customers, powered by NVIDIA Nemotron on Nebius Token Factory"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "openai>=1.60",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "rich>=13.9",
    "httpx>=0.27",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 140
